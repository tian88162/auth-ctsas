name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout代码
      uses: actions/checkout@v4
    
    - name: 设置Java环境
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'
    
    - name: 设置Flutter环境
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true
    
    - name: 获取依赖
      run: flutter pub get
    
    - name: 构建APK
      run: flutter build apk --release
    
    - name: 上传APK
      uses: actions/upload-artifact@v4
      with:
        name: campus-auth-release
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
    
    - name: 创建Release（如果是tag）
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/app/outputs/flutter-apk/app-release.apk
        body: |
          ## 校园网自动认证 - Android版
          
          ### 安装说明
          1. 下载 `app-release.apk`
          2. 允许"未知来源"安装
          3. 打开APP填写账号密码
          4. 开启自动登录
          
          ### 功能特性
          - ✅ 自动检测Portal并登录
          - ✅ WiFi状态监听
          - ✅ 后台保活
          - ✅ 支持VBRAS/锐捷/深澜/Dr.COM
