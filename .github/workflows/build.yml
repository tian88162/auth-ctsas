name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 拉取代码
      uses: actions/checkout@v4
    
    - name: 配置Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: 安装Flutter 3.24.0
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true
    
    - name: 写入local.properties
      run: |
        echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
        echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
    
    - name: 生成缺失的平台文件（Gradle Wrapper等）
      run: |
        # flutter create --platforms android 会合并补全缺失文件，不覆盖已有文件
        flutter create --platforms android --org com.campusauth --project-name campus_auth_mobile . || true
        # 确保local.properties有正确路径（flutter create 可能覆盖）
        echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
        echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
    
    - name: 获取依赖
      run: flutter pub get
    
    - name: 编译APK（release）
      run: flutter build apk --release --no-tree-shake-icons
    
    - name: 上传APK
      uses: actions/upload-artifact@v4
      with:
        name: campus-auth-v1.0-release
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
